<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conecta · Chuy Cortez</title>
<meta name="description" content="Tarjeta de presentación digital de Chuy Cortez.">
<meta name="theme-color" content="#FAFAF9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9; --surface:#FFFFFF; --fg:#111111; --muted:#6B6B6B; --line:#E7E5E4;
    --accent:#0B7A63; --accent-ink:#FFFFFF; --soft:#F2F1EF;
    --font:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B0B0B; --surface:#151515; --fg:#F5F5F4; --muted:#A3A3A3; --line:#262626;
      --accent:#6FE2AE; --accent-ink:#04201C; --soft:#1C1C1C; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;
    min-height:100vh;display:flex;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
  main{width:100%;max-width:440px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:15px}
  .brand span{color:var(--accent)}
  .lang{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:999px;padding:6px 12px;font:600 12px var(--font);cursor:pointer}

  .hero{text-align:center}
  .avatar-wrap{position:relative;width:112px;height:112px;margin:0 auto 18px}
  .avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:center 20%;
    background:var(--soft);border:1px solid var(--line)}
  .logo{position:absolute;right:-4px;bottom:-4px;width:38px;height:38px;border-radius:12px;
    background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;
    border:3px solid var(--bg);overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
  .role{color:var(--muted);font-size:15px;margin-top:4px}
  .role b{color:var(--fg);font-weight:600}
  .desc{font-size:15px;margin:16px auto 0;max-width:34ch;color:var(--fg);opacity:.85}

  .met{margin:24px 0 0;border:1px solid var(--line);background:var(--surface);border-radius:16px;
    padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
  .met .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .met .label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .met .place{font-weight:600;font-size:15px}
  .met .when{font-size:13px;color:var(--muted)}
  .met button{margin-top:6px;background:none;border:0;color:var(--accent);font:600 13px var(--font);
    padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;
    background:var(--fg);color:var(--bg);border:0;border-radius:14px;padding:16px;
    font:700 16px var(--font);cursor:pointer;text-decoration:none}
  .primary:active{transform:scale(.99)}
  .secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;
    background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;
    font:600 15px var(--font);text-decoration:none}

  .list{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--fg);text-decoration:none;
    border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .ico{flex:none;width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
  .ico svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .row .k{font-size:12px;color:var(--muted)}
  .row .v{font-size:15px;font-weight:600;word-break:break-word}
  .row .chev{margin-left:auto;color:var(--muted)}

  .socials{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
  .socials a{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;
    color:var(--fg);text-decoration:none;background:var(--surface)}

  footer{text-align:center;margin-top:36px;font-size:12px;color:var(--muted)}
  footer a{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
    background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;
    transition:transform .3s}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">conecta<span>.</span></div>
    <button class="lang" id="lang" aria-label="Cambiar idioma">EN</button>
  </div>

  <section class="hero">
    <div class="avatar-wrap">
      <img class="avatar" id="photo" alt="">
      <div class="logo" id="logo"></div>
    </div>
    <h1 id="name"></h1>
    <p class="role"><span id="title"></span> · <b id="company"></b></p>
    <p class="desc" id="desc"></p>
  </section>

  <div class="met" id="met">
    <div class="dot"></div>
    <div>
      <div class="label" data-t="met"></div>
      <div class="place" id="place">…</div>
      <div class="when" id="when"></div>
      <button id="gps" data-t="gps"></button>
    </div>
  </div>

  <button class="primary" id="save">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    <span data-t="save"></span>
  </button>
  <a class="secondary" id="book" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span data-t="book"></span>
  </a>

  <div class="list">
    <a class="row" id="r-phone">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
      <div><div class="k" data-t="phone"></div><div class="v" id="phone"></div></div><span class="chev">›</span>
    </a>
    <a class="row" id="r-email">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
      <div><div class="k" data-t="email"></div><div class="v" id="email"></div></div><span class="chev">›</span>
    </a>
    <a class="row" id="r-web" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></span>
      <div><div class="k" data-t="web"></div><div class="v" id="web"></div></div><span class="chev">›</span>
    </a>
  </div>

  <div class="socials" id="socials"></div>

  <footer><span data-t="made"></span> <a href="card.html">conecta</a></footer>
</main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
  var C = window.CONECTA;
  var T = {
    es:{met:"Nos conocimos en", gps:"Usar ubicación exacta", save:"Guardar contacto", book:"Agendar una reunión",
        phone:"Teléfono", email:"Correo", web:"Sitio web", made:"Tarjeta digital hecha con",
        locating:"Buscando ubicación…", unknown:"Ubicación no disponible", saved:"Contacto listo",
        noteMet:"Nos conocimos en", via:"vía Conecta", locale:"es-MX", other:"EN"},
    en:{met:"We met in", gps:"Use exact location", save:"Save contact", book:"Book a meeting",
        phone:"Phone", email:"Email", web:"Website", made:"Digital card made with",
        locating:"Finding location…", unknown:"Location unavailable", saved:"Contact ready",
        noteMet:"We met in", via:"via Conecta", locale:"en-US", other:"ES"}
  };
  var lang = (navigator.language||"es").slice(0,2) === "en" ? "en" : "es";
  try { lang = localStorage.getItem("conecta-lang") || lang; } catch(e){}
  var meeting = { place:null, date:new Date(), exact:false };
  var $ = function(id){ return document.getElementById(id); };

  function render(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = t[el.dataset.t]; });
    $("lang").textContent = t.other;
    $("name").textContent = C.firstName + " " + C.lastName;
    $("title").textContent = C.title[lang];
    $("company").textContent = C.company;
    $("desc").textContent = C.description[lang];
    $("when").textContent = meeting.date.toLocaleDateString(t.locale,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("place").textContent = meeting.place || t.locating;
    $("gps").style.display = meeting.exact ? "none" : "";
  }

  // Static content
  $("photo").src = C.photo; $("photo").alt = C.firstName + " " + C.lastName;
  $("logo").innerHTML = C.logo ? '<img src="'+C.logo+'" alt="">' : C.logoText;
  $("phone").textContent = C.phone; $("r-phone").href = "tel:" + C.phone.replace(/[^+\d]/g,"");
  $("email").textContent = C.email; $("r-email").href = "mailto:" + C.email;
  $("web").textContent = C.website.replace(/^https?:\/\//,""); $("r-web").href = C.website;
  $("book").href = C.bookingUrl;
  C.socials.forEach(function(s){
    var a = document.createElement("a"); a.href = s.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = s.name; $("socials").appendChild(a);
  });

  $("lang").onclick = function(){
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("conecta-lang", lang); } catch(e){}
    render();
  };

  // Where we met: approximate city from the network, no permission needed
  function setPlace(p, exact){ meeting.place = p; meeting.exact = !!exact; render(); }
  var ctl = new AbortController(); setTimeout(function(){ ctl.abort(); }, 5000);
  fetch("https://ipapi.co/json/", {signal:ctl.signal}).then(function(r){ return r.json(); }).then(function(d){
    if (meeting.exact) return;
    var p = [d.city, d.region, d.country_name].filter(Boolean).join(", ");
    setPlace(p || T[lang].unknown);
  }).catch(function(){ if (!meeting.exact && !meeting.place) setPlace(T[lang].unknown); });

  // Exact location, only if the person allows it
  $("gps").onclick = function(){
    if (!navigator.geolocation) return;
    $("place").textContent = T[lang].locating;
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language="+lang+"&lat="+lat+"&lon="+lon)
        .then(function(r){ return r.json(); }).then(function(d){
          var a = d.address || {};
          var p = [d.name || a.road, a.city || a.town || a.village, a.state].filter(Boolean).join(", ");
          setPlace(p || lat.toFixed(4)+", "+lon.toFixed(4), true);
        }).catch(function(){ setPlace(lat.toFixed(4)+", "+lon.toFixed(4), true); });
    }, function(){ render(); }, {enableHighAccuracy:true, timeout:10000});
  };

  // Save contact as a vCard, including photo and where you met
  function photoBase64(){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var s = 400, c = document.createElement("canvas"); c.width = s; c.height = s;
        var side = Math.min(img.width, img.height), sy = Math.max(0,(img.height-side)*0.2);
        c.getContext("2d").drawImage(img, (img.width-side)/2, sy, side, side, 0, 0, s, s);
        resolve(c.toDataURL("image/jpeg",0.85).split(",")[1]);
      };
      img.onerror = function(){ resolve(null); };
      img.src = C.photo;
    });
  }
  function esc(v){ return String(v).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
  $("save").onclick = function(){
    var t = T[lang];
    photoBase64().then(function(b64){
      var day = meeting.date.toLocaleDateString(t.locale,{day:"numeric",month:"long",year:"numeric"});
      var known = meeting.place && meeting.place !== t.unknown;
      var note = (known ? t.noteMet + " " + meeting.place + " · " : "") + day + " (" + t.via + ")";
      var v = ["BEGIN:VCARD","VERSION:3.0",
        "N:"+esc(C.lastName)+";"+esc(C.firstName)+";;;",
        "FN:"+esc(C.firstName+" "+C.lastName),
        "ORG:"+esc(C.company), "TITLE:"+esc(C.title[lang]),
        "TEL;TYPE=CELL:"+C.phone, "EMAIL;TYPE=INTERNET:"+C.email,
        "URL:"+C.website, "URL;TYPE=Booking:"+C.bookingUrl];
      C.socials.forEach(function(s){ v.push("X-SOCIALPROFILE;TYPE="+s.name.toLowerCase()+":"+s.url); });
      v.push("NOTE:"+esc(C.description[lang]+"\n\n"+note));
      if (b64) v.push("PHOTO;ENCODING=b;TYPE=JPEG:"+b64);
      v.push("END:VCARD");
      var blob = new Blob([v.join("\r\n")], {type:"text/vcard;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (C.firstName+"-"+C.lastName).toLowerCase()+".vcf";
      document.body.appendChild(a); a.click(); a.remove();
      var toast = $("toast"); toast.textContent = t.saved; toast.classList.add("show");
      setTimeout(function(){ toast.classList.remove("show"); }, 2200);
    });
  };

  render();
})();
</script>
</body>
</html>
